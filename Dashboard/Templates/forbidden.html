<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Denied</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Modal HTML structure -->
    <div class="modal fade" id="forbiddenModal" tabindex="-1" aria-labelledby="forbiddenModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="forbiddenModalLabel">Access Denied</h5>
                </div>
                <div class="modal-body">
                    {{ message }}
                </div>
               
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (necessary for modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script to automatically trigger the modal when the page loads -->
    <script type="text/javascript">
        var myModal = new bootstrap.Modal(document.getElementById('forbiddenModal'));
        myModal.show();
    </script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <style>
        
        /* http://chir.ag/projects/name-that-color */

        :root {
            box-sizing: border-box;
        }



        /* https://www.w3schools.com/howto/howto_css_custom_checkbox.asp */




        /* Show the checkmark when checked */

        .label--remember-me input:checked~.checkmark:after {
            display: block;
        }

        .label--remember-me .checkmark:after {
            left: 9px;
            top: 5px;
            width: 5px;
            height: 10px;
            border: solid #2c3338;
            border-width: 0 3px 3px 0;
            -webkit-transform: rotate(45deg);
            transform: rotate(45deg);
        }

        .remember-me-text {
            margin-left: 0.5em;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
            padding: 0;
        }

        .login-container {
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            height: 100vh;
            width: 100vw;
            max-height: 100vh;
            max-width: 100vw;
        }

        .hidden {
            display: none;
        }

        input {
            border: 0;
            color: inherit;
            font: inherit;
            margin: 0;
            outline: 0;
            padding: 0;
            width: 100%;
        }

        .form.login {
            max-width: 30em;
            width: 80%;
            border: 1px solid #9fd8f1;
            padding: 4em 1em;
            border-radius: 20px;
        }

        .login .label.label--icon {
            background-color: #eee;
        }

        .login .label.label--icon,
        .login input[type='text'],
        .login input[type='password'],
        .login input[type='submit'] {
            padding: 1rem;
        }

        .form__input-wrapper {
            width: 100%;
            position: relative;
        }

        .login input[type='password'],
        .login input[type='text'] {
            border-bottom: 2px solid #ddf1fa;
            position: relative;
        }

        .login input[type='password']:focus+.underline-wrapper>.underline,
        .login input[type='text']:focus+.underline-wrapper>.underline {
            -webkit-transform: scale(1);
            transform: scale(1);
        }

        .underline-wrapper {
            position: relative;
        }

        .underline {
            background-color: #9fd8f1;
            display: inline-block;
            height: 2px;
            margin-top: -2px;
            position: absolute;
            -webkit-transform: scale(0, 1);
            transform: scale(0, 1);
            transition: all 0.2s linear;
            width: 100%;
        }

        .login input[type='submit'] {
            background-color: #ddf1fa;
            color: #2c3338;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .login input[type='submit']:focus,
        .login input[type='submit']:hover {
            background-color: #9fd8f1;
            color: #eee;
        }

        .form__field,
        .forgot-password {
            margin: 0.875rem;
        }

        .form__field--email,
        .form__field--password {
            display: flex;
        }

        .form__input[type='checkbox'] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .icon {
            display: inline-block;
            fill: #606468;
            font-size: 1rem;
            height: 1em;
            vertical-align: middle;
            width: 1em;
        }

        .form__field--submit {
            width: 100%;
        }

        .login-actions-container {
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            justify-content: space-between;
        }

        .form__field--remember-me {
            order: 1;
        }

        .forgot-password {
            order: 2;
        }

        .forgot-password {
            color: #3f51b5;
            text-decoration: none;
        }

        .forgot-password:hover {
            color: #2c3338;
            text-decoration: underline;
        }

        .cartoon-container {
            width: 22em;
            margin-bottom: 2.5em;
        }

        @media only screen and (min-width: 960px) {
            body {
                background-color: white;
            }

            .overlay {
                height: 100vh;
                width: 100vw;
                max-height: 100vh;
                max-width: 100vw;

                -webkit-clip-path: polygon(10% 0%, 70% 0%, 90% 100%, 30% 100%);

                clip-path: polygon(10% 0%, 70% 0%, 90% 100%, 30% 100%);
                z-index: -100;
                background-color: #f8f9fa;
                top: 0;
                position: absolute;
                display: inline-block;
                overflow: hidden;
            }

            .form__field--submit {
                width: 50%;
            }

            .forgot-password {
                width: 100%;
                text-align: right;
            }
        }
    
    </style>
</head>

<body>

    <div class="login-container">
        <form class="form login" method="POST"  action="{% url 'login' %}">
            {% csrf_token %}
            <img src="{% static 'assets/images/hazeco-logo.png' %}" width="130px;" style="margin-left:33%; margin-bottom:20px;" alt="">

            <div class="form__field form__field--email">
                <label class="label label--icon" for="login__email">
                    <svg class="icon">
                        <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#user"></use>
                    </svg>
                    <span class="hidden">login</span>
                </label>
                <div class="form__input-wrapper">
                    <input id="login__email" type="text" name="username" class="form__input" placeholder="Email" required>

                    <div class="underline-wrapper">
                        <span class="underline"></span>
                    </div>
                </div>
            </div>

            <div class="form__field form__field--password">
                <label class="label label--icon" for="login__password">
                    <svg class="icon">
                        <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#lock"></use>
                    </svg>
                    <span class="hidden">Password</span>
                </label>
                <div class="form__input-wrapper">
                    <input id="login__password" type="password" name="password" class="form__input" placeholder="Password" required>
                    <div class="underline-wrapper">
                        <span class="underline"></span>
                    </div>
                </div>
            </div>

            <div class="login-actions-container" style="margin-left: 30%;">
                <div class="form__field form__field--submit">
                    <input type="submit" value="Log in">
                </div>
            </div>

        </form>

        <svg width="0" height="0" xmlns="http://www.w3.org/2000/svg" class="icons">
            <symbol id="lock" viewBox="0 0 1792 1792">
                <path
                    d="M640 768h512V576q0-106-75-181t-181-75-181 75-75 181v192zm832 96v576q0 40-28 68t-68 28H416q-40 0-68-28t-28-68V864q0-40 28-68t68-28h32V576q0-184 132-316t316-132 316 132 132 316v192h32q40 0 68 28t28 68z" />
            </symbol>
            <symbol id="user" viewBox="0 0 1792 1792">
                <path
                    d="M1600 1405q0 120-73 189.5t-194 69.5H459q-121 0-194-69.5T192 1405q0-53 3.5-103.5t14-109T236 1084t43-97.5 62-81 85.5-53.5T538 832q9 0 42 21.5t74.5 48 108 48T896 971t133.5-21.5 108-48 74.5-48 42-21.5q61 0 111.5 20t85.5 53.5 62 81 43 97.5 26.5 108.5 14 109 3.5 103.5zm-320-893q0 159-112.5 271.5T896 896 624.5 783.5 512 512t112.5-271.5T896 128t271.5 112.5T1280 512z" />
            </symbol>
        </svg>
    </div>

</body>

</html>
